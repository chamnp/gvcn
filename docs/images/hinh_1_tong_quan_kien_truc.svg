<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gCard1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="gCard2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ecfdf5"/><stop offset="100%" stop-color="#d1fae5"/></linearGradient>
    <linearGradient id="gCard3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fdf4ff"/><stop offset="100%" stop-color="#fae8ff"/></linearGradient>
    <linearGradient id="gCard4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#ffedd5"/></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="30" width="1120" height="90" rx="16" fill="url(#gHeader)" filter="url(#shadow)"/>
  <text x="600" y="70" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">KIẾN TRÚC TỔNG THỂ HỆ SINH THÁI CHUYỂN ĐỔI SỐ "GVCN PRO"</text>
  <text x="600" y="98" text-anchor="middle" fill="#93c5fd" font-size="14">Nền tảng hỗ trợ toàn diện Giáo viên Chủ nhiệm Tiểu học theo Thông tư 27/2020/TT-BGDĐT</text>

  <!-- Central Hub -->
  <rect x="440" y="160" width="320" height="110" rx="16" fill="#1e293b" filter="url(#shadow)"/>
  <circle cx="480" cy="215" r="24" fill="#3b82f6"/>
  <text x="480" y="222" text-anchor="middle" fill="#ffffff" font-size="20">⚡</text>
  <text x="520" y="205" fill="#ffffff" font-size="18" font-weight="bold">LÕI DỮ LIỆU ĐIỀU HÀNH</text>
  <text x="520" y="228" fill="#94a3b8" font-size="13">Lớp 4A1 - Trường TH Đại Mỗ</text>
  <text x="520" y="248" fill="#38bdf8" font-size="12">Next.js 16 + Supabase Database</text>

  <!-- 4 Main Pillars -->
  <!-- Pillar 1: Sơ đồ lớp & Nề nếp -->
  <g transform="translate(60, 310)" filter="url(#shadow)">
    <rect width="250" height="320" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="250" height="50" rx="14" fill="url(#gCard1)"/>
    <text x="20" y="32" fill="#1e40af" font-size="16" font-weight="bold">🪑 Sơ Đồ &amp; Nề Nếp</text>
    <text x="20" y="80" fill="#334155" font-size="13" font-weight="bold">1. Lưới bàn học 5x8:</text>
    <text x="35" y="105" fill="#64748b" font-size="12">• Kéo thả đổi chỗ 1 chạm</text>
    <text x="35" y="125" fill="#64748b" font-size="12">• Ưu tiên học sinh cận thị</text>
    <text x="20" y="160" fill="#334155" font-size="13" font-weight="bold">2. Tích Sao Hoa Việc Tốt:</text>
    <text x="35" y="185" fill="#64748b" font-size="12">• Thưởng điểm phát biểu (+1)</text>
    <text x="35" y="205" fill="#64748b" font-size="12">• Hiệu ứng pháo hoa vui nhộn</text>
    <text x="35" y="225" fill="#64748b" font-size="12">• Nhật ký rèn luyện (StarLog)</text>
    <rect x="20" y="260" width="210" height="40" rx="8" fill="#dbeafe"/>
    <text x="125" y="285" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Tăng 100% hào hứng học tập</text>
  </g>

  <!-- Pillar 2: Điểm danh & Bán trú -->
  <g transform="translate(340, 310)" filter="url(#shadow)">
    <rect width="250" height="320" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="250" height="50" rx="14" fill="url(#gCard2)"/>
    <text x="20" y="32" fill="#065f46" font-size="16" font-weight="bold">📅 Điểm Danh &amp; Bán Trú</text>
    <text x="20" y="80" fill="#334155" font-size="13" font-weight="bold">1. Điểm diện buổi sáng:</text>
    <text x="35" y="105" fill="#64748b" font-size="12">• 1 chạm ghi nhận Có/Vắng</text>
    <text x="35" y="125" fill="#64748b" font-size="12">• Ghi chú lý do nghỉ phép</text>
    <text x="20" y="160" fill="#334155" font-size="13" font-weight="bold">2. Báo suất ăn bán trú:</text>
    <text x="35" y="185" fill="#64748b" font-size="12">• Tự tính số suất ăn thực tế</text>
    <text x="35" y="205" fill="#64748b" font-size="12">• Copy tin nhắn Zalo 1-Click</text>
    <text x="35" y="225" fill="#64748b" font-size="12">• Báo tức thời cho Nhà bếp</text>
    <rect x="20" y="260" width="210" height="40" rx="8" fill="#d1fae5"/>
    <text x="125" y="285" text-anchor="middle" fill="#065f46" font-size="12" font-weight="bold">Chuẩn xác 100% suất ăn</text>
  </g>

  <!-- Pillar 3: Đánh giá TT27 & AI -->
  <g transform="translate(620, 310)" filter="url(#shadow)">
    <rect width="250" height="320" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect width="250" height="50" rx="14" fill="url(#gCard3)"/>
    <text x="20" y="32" fill="#6b21a8" font-size="16" font-weight="bold">🤖 Đánh Giá TT27 &amp; AI</text>
    <text x="20" y="80" fill="#334155" font-size="13" font-weight="bold">1. Đánh giá chuẩn TT27:</text>
    <text x="35" y="105" fill="#64748b" font-size="12">• Ma trận 11 môn + 14 PC-NL</text>
    <text x="35" y="125" fill="#64748b" font-size="12">• Tự xét Xuất sắc / Tiêu biểu</text>
    <text x="20" y="160" fill="#334155" font-size="13" font-weight="bold">2. Trợ lý Sư phạm AI:</text>
    <text x="35" y="185" fill="#64748b" font-size="12">• Dual-Engine: LLM &amp; Offline</text>
    <text x="35" y="205" fill="#64748b" font-size="12">• Sinh nhận xét cả lớp 15 giây</text>
    <text x="35" y="225" fill="#64748b" font-size="12">• Cá nhân hóa, không trùng lặp</text>
    <rect x="20" y="260" width="210" height="40" rx="8" fill="#f3e8ff"/>
    <text x="125" y="285" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="bold">Tiết kiệm 90% thời gian</text>
  </g>

  <!-- Pillar 4: Cổng QR & Sổ liên lạc PIN -->
  <g transform="translate(900, 310)" filter="url(#shadow)">
    <rect width="250" height="320" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="250" height="50" rx="14" fill="url(#gCard4)"/>
    <text x="20" y="32" fill="#9a3412" font-size="16" font-weight="bold">📱 Kênh Kết Nối CMHS</text>
    <text x="20" y="80" fill="#334155" font-size="13" font-weight="bold">1. Cổng Bài Tập QR:</text>
    <text x="35" y="105" fill="#64748b" font-size="12">• Quét mã xem bài ngay</text>
    <text x="35" y="125" fill="#64748b" font-size="12">• Không cần lập tài khoản</text>
    <text x="20" y="160" fill="#334155" font-size="13" font-weight="bold">2. Sổ Liên Lạc Số Bảo Mật:</text>
    <text x="35" y="185" fill="#64748b" font-size="12">• Mã PIN riêng từng gia đình</text>
    <text x="35" y="205" fill="#64748b" font-size="12">• Bảo mật quyền riêng tư trẻ</text>
    <text x="35" y="225" fill="#64748b" font-size="12">• Tra cứu kết quả và dặn dò</text>
    <rect x="20" y="260" width="210" height="40" rx="8" fill="#ffedd5"/>
    <text x="125" y="285" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">97.8% Phụ huynh hài lòng</text>
  </g>

  <!-- Flow Connectors -->
  <path d="M 500 270 L 185 310" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 560 270 L 465 310" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 640 270 L 745 310" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 700 270 L 1025 310" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
</svg>