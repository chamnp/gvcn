<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgQR" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <filter id="qShadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08"/></filter>
  </defs>

  <rect x="0" y="0" width="1100" height="60" fill="url(#bgQR)"/>
  <text x="30" y="37" fill="#ffffff" font-size="18" font-weight="bold">GVCN PRO - Cổng Bài Tập Về Nhà QR &amp; Sổ Liên Lạc Điện Tử Bảo Mật</text>
  <text x="890" y="37" fill="#ffedd5" font-size="13">Tiểu học Đại Mỗ - Lớp 4A1</text>

  <!-- Left: Mobile View for Homework QR -->
  <g transform="translate(40, 80)" filter="url(#qShadow)">
    <!-- Smartphone Frame -->
    <rect width="320" height="520" rx="36" fill="#0f172a"/>
    <rect x="10" y="10" width="300" height="500" rx="28" fill="#ffffff"/>
    
    <!-- Phone Top Status Bar -->
    <rect x="100" y="18" width="120" height="16" rx="8" fill="#0f172a"/>
    <text x="30" y="30" fill="#0f172a" font-size="10" font-weight="bold">08:30</text>
    
    <!-- Phone Header -->
    <rect x="10" y="45" width="300" height="60" fill="#ea580c"/>
    <text x="160" y="70" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">BÀI TẬP VỀ NHÀ - LỚP 4A1</text>
    <text x="160" y="90" text-anchor="middle" fill="#ffedd5" font-size="11">Hạn nộp: Ngày mai (Thứ Năm)</text>

    <!-- Homework Card 1 -->
    <rect x="25" y="120" width="270" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="35" y="130" width="65" height="20" rx="4" fill="#dbeafe"/>
    <text x="67" y="144" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="bold">📖 TOÁN 4</text>
    <text x="35" y="168" fill="#0f172a" font-size="12" font-weight="bold">Bài 34: Ôn tập phép chia</text>
    <text x="35" y="190" fill="#64748b" font-size="11">Làm bài 1, 2 trang 45 VBT Toán</text>
    <text x="35" y="208" fill="#16a34a" font-size="10">✓ Mang compa, thước kẻ cho ngày mai</text>

    <!-- Homework Card 2 -->
    <rect x="25" y="235" width="270" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="35" y="245" width="90" height="20" rx="4" fill="#fef3c7"/>
    <text x="80" y="259" text-anchor="middle" fill="#b45309" font-size="10" font-weight="bold">✍️ TIẾNG VIỆT</text>
    <text x="35" y="283" fill="#0f172a" font-size="12" font-weight="bold">Đọc diễn cảm bài "Mùa hoa sim"</text>
    <text x="35" y="303" fill="#64748b" font-size="11">Trả lời 3 câu hỏi cuối bài đọc</text>

    <!-- Homework Card 3: Notice -->
    <rect x="25" y="340" width="270" height="90" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="35" y="362" fill="#1e40af" font-size="12" font-weight="bold">📢 Dặn Dò Của Cô Hằng:</text>
    <text x="35" y="385" fill="#334155" font-size="11">• Ngày mai lớp học Tiết Mỹ thuật</text>
    <text x="35" y="405" fill="#334155" font-size="11">• Các con mang đủ hộp sáp màu nhé!</text>

    <!-- QR Badge -->
    <rect x="60" y="445" width="200" height="35" rx="8" fill="#ea580c"/>
    <text x="160" y="467" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">📲 Quét mã xem - Không cần đăng nhập</text>
  </g>

  <!-- Right: Student Private Report with PIN -->
  <g transform="translate(400, 80)" filter="url(#qShadow)">
    <rect width="660" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    
    <!-- Header -->
    <rect width="660" height="60" rx="16" fill="#f8fafc"/>
    <circle cx="45" cy="30" r="18" fill="#dbeafe"/>
    <text x="45" y="36" text-anchor="middle" fill="#1d4ed8" font-size="14">🔒</text>
    <text x="75" y="28" fill="#0f172a" font-size="15" font-weight="bold">Sổ Liên Lạc Điện Tử Bảo Mật (Mã PIN Cá Nhân)</text>
    <text x="75" y="48" fill="#64748b" font-size="12">Dành riêng cho Phụ huynh em: Trần Bảo Nam (4A1)</text>

    <!-- Security Banner -->
    <rect x="30" y="80" width="600" height="55" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="50" y="105" fill="#065f46" font-size="13" font-weight="bold">🛡️ BẢO MẬT TUYỆT ĐỐI THEO LUẬT TRẺ EM:</text>
    <text x="50" y="123" fill="#047857" font-size="12">Mỗi học sinh có đường dẫn riêng + Mã PIN 4 số bí mật. Không công khai điểm số lên MXH.</text>

    <!-- Student Dashboard Snapshot -->
    <rect x="30" y="150" width="285" height="130" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="45" y="175" fill="#6b21a8" font-size="13" font-weight="bold">⭐ Nhật Ký Điểm Sao Nề Nếp</text>
    <text x="45" y="210" fill="#7c3aed" font-size="28" font-weight="bold">24 <tspan font-size="14">Sao hoa điểm mười</tspan></text>
    <text x="45" y="235" fill="#15803d" font-size="11 font-weight:bold">✓ Top 1 gương mẫu trong tuần</text>
    <text x="45" y="255" fill="#64748b" font-size="11">• +2 sao: Làm bài Toán xuất sắc</text>

    <rect x="345" y="150" width="285" height="130" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="360" y="175" fill="#1e40af" font-size="13" font-weight="bold">📊 Kết Quả Học Tập Cuối Kỳ</text>
    <text x="360" y="210" fill="#1d4ed8" font-size="28" font-weight="bold">10.0 <tspan font-size="14">Toán &amp; Tiếng Việt</tspan></text>
    <text x="360" y="235" fill="#b45309" font-size="11 font-weight:bold">👑 Danh hiệu: Học sinh Xuất sắc</text>
    <text x="360" y="255" fill="#64748b" font-size="11">• 5 Phẩm chất &amp; 3 Năng lực: Tốt (T)</text>

    <!-- Teacher Personal Message -->
    <rect x="30" y="300" width="600" height="130" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="45" y="325" fill="#9a3412" font-size="13" font-weight="bold">💌 Lời Nhận Xét Riêng Của Cô Chủ Nhiệm:</text>
    <text x="45" y="355" fill="#334155" font-size="12" font-weight="500">
      <tspan x="45" dy="0">"Em Bảo Nam có tư duy Toán học rất nhanh nhẹn, tiếp thu bài tốt và chữ viết sạch</tspan>
      <tspan x="45" dy="20">đẹp. Em luôn chan hòa, năng nổ giúp đỡ bạn bè trong lớp. Cô rất tự hào về em!"</tspan>
    </text>
    <text x="45" y="410" fill="#ea580c" font-size="12" font-weight="bold">Cô Nguyễn Thị Minh Hằng • Ngày 27/08/2026</text>

    <!-- Parent Interaction Buttons -->
    <rect x="30" y="445" width="285" height="45" rx="8" fill="#ea580c"/>
    <text x="172" y="473" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">❤️ Đã Nhận Thông Tin &amp; Cảm Ơn Cô</text>

    <rect x="345" y="445" width="285" height="45" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="487" y="473" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">💬 Gửi Lời Nhắn Riêng Cho Cô</text>
  </g>
</svg>