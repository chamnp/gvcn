    <text x="20" y="28" fill="#ffffff" font-size="14" font-weight="bold">📲 Báo Cáo Zalo Bán Trú (1-Click)</text>
    
    <rect x="20" y="65" width="320" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="35" y="95" fill="#0f172a" font-size="12" font-weight="bold">[BÁO CÁO BÁN TRÚ TRƯỜNG TH ĐẠI MỖ]</text>
    <text x="35" y="125" fill="#334155" font-size="12">• Lớp: 4A1 | Ngày: 27/08/2026</text>
    <text x="35" y="150" fill="#334155" font-size="12">• Tổng sĩ số: 45 học sinh</text>
    <text x="35" y="175" fill="#334155" font-size="12">• Có mặt: 44 | Vắng: 01 (Bùi Đức Minh - Sốt)</text>
    <text x="35" y="200" fill="#047857" font-size="12" font-weight="bold">• Số suất ăn bán trú: 44 suất (Bớt 01)</text>
    <text x="35" y="235" fill="#475569" font-size="12">GVCN: Cô Nguyễn Thị Minh Hằng (4A1)</text>

    <!-- Copy Button -->
    <rect x="20" y="315" width="320" height="50" rx="10" fill="#059669"/>
    <text x="180" y="346" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">📋 SAO CHÉP GỬI ZALO NHÀ BẾP</text>
