  <text x="50" y="600" fill="#475569" font-size="13" font-weight="bold">Ghi chú:</text>
  <rect x="120" y="588" width="16" height="16" rx="4" fill="#fee2e2"/>
  <text x="145" y="601" fill="#475569" font-size="12">Ưu tiên cận thị (Bàn đầu)</text>
  <circle cx="340" cy="596" r="8" fill="#fef3c7"/>
  <text x="355" y="601" fill="#475569" font-size="12">Huy hiệu Sao nề nếp</text>
  <rect x="520" y="588" width="16" height="16" rx="4" fill="#dcfce7"/>
  <text x="545" y="601" fill="#475569" font-size="12">Có mặt ăn bán trú</text>
  <rect x="700" y="588" width="16" height="16" rx="4" fill="#fee2e2"/>
  <text x="725" y="601" fill="#475569" font-size="12">Vắng có phép</text>
