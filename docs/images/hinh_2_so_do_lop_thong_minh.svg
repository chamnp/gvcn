    <rect x="780" y="0" width="220" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="815" cy="45" r="20" fill="#dbeafe"/>
    <text x="815" y="51" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">08</text>
