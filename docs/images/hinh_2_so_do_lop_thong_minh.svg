  <rect x="905" y="93" width="145" height="34" rx="8" fill="#10b981"/>
  <text x="977" y="115" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">⭐ Thưởng Sao Cả Lớp</text>

  <!-- Blackboard Indicator -->
