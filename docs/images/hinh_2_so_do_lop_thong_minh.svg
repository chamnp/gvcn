  <rect x="140" y="16" width="130" height="28" rx="6" fill="#3b82f6"/>
  <text x="205" y="35" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Lớp 4A1 (45 HS)</text>
  <text x="920" y="36" fill="#bfdbfe" font-size="13">GVCN: Cô Nguyễn Thị Minh Hằng</text>

  <!-- Header Action Bar -->
  <rect x="30" y="80" width="1040" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
